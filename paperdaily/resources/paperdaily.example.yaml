user:
  id: user_001
  timezone: Asia/Shanghai
runtime:
  database: ../../data/paperflow.db
  output_dir: ../../data/output
daily:
  # 0 means no cap for a one-day digest.
  default_limit: 0
  rerank_limit: 30
  llm_rerank_enabled: true
  llm_rerank_weight: 0.25
  llm_rerank_max_tokens: 3000
  llm_rerank_input_cost_per_million_tokens: 0.0
  llm_rerank_output_cost_per_million_tokens: 0.0
  semantic_recall_enabled: true
  semantic_recall_threshold: 0.58
  semantic_recall_limit: 30
  summary_language: zh-CN
  generate_chinese_summary: true
  channels: [terminal, markdown]
  arxiv_page_size: 200
  arxiv_max_results: 5000
  arxiv_request_delay_seconds: 3
  arxiv_cache_ttl_hours: 24
  arxiv_rss_enabled: true
  arxiv_rss_include_cross_list: true
  arxiv_rss_cache_ttl_minutes: 15
  arxiv_api_id_batch_size: 20
  mmr_lambda: 0.75
catchup:
  interactive: true
  auto_catchup_days: 2
  first_run_days: 7
  default_window_days: 7
  max_window_days: 30
  max_papers_per_run: 30
  overflow_mode: curated
topics:
  - id: embodied-vla
    name: 具身智能与 VLA
    enabled: true
    description: >
      关注视觉语言动作模型、机器人基础模型、World Action Model、跨本体学习、
      机器人操作、动作表示、机器人数据扩展和真实机器人泛化。
    arxiv_categories: [cs.RO, cs.AI, cs.CV, cs.LG, cs.CL]
    exact_phrases:
      - vision-language-action
      - vision language action
      - world action model
      - world-action model
      - robot foundation model
      - generalist robot policy
      - cross-embodiment
    keywords:
      - VLA
      - WAM
      - OpenVLA
      - SmolVLA
      - RT-2
      - GR00T
      - pi0
      - pi0.5
      - Octo
      - RoboMamba
      - robotic manipulation
      - visuomotor policy
      - diffusion policy
      - flow matching policy
      - action tokenization
      - imitation learning
      - robot learning
    context_keywords: [robot, robotic, manipulation, embodied, action, policy, embodiment]
    negative_keywords: [wireless access management, web application monitoring]
    # 0 means no per-topic quota.
    daily_limit: 0
    minimum_score: 0.25
